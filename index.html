<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Mirufin</title>
    <link rel="icon" href="/mirufin-m.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit is loaded without blocking the first paint: a TV that cannot reach Google
         Fonts used to sit on a blank page until the request timed out. The stylesheet
         falls back to Segoe UI in the meantime. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      html, body { margin: 0; background: #000; height: 100%; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #000;
      }
      /* The width the native splash draws the logo at, in design units: 840 of the 1500 the
         television layout is drawn on, which is 56% of the screen. The script below (and
         src/main.tsx, which re-runs it) sets --boot-logo-width to that once the root zoom is
         on, so the boot splash and the splash behind it are the same size. Without it - a
         plain browser, or a shell with no document-start script support - the fallback keeps
         the old viewport-relative sizing. */
      #boot img { width: var(--boot-logo-width, min(920px, 68vw)); height: auto; }
    </style>
    <script>
      /**
       * Mirufin draws its television layout on a 1500px-wide canvas that is scaled to fill
       * the screen with a root `zoom`, the way the Android shell does.
       *
       * It is applied here, in the head, so it is already in force for the very first paint.
       * Applying it later - which is what used to happen, from src/main.tsx once the app
       * bundle ran - painted the boot splash at its un-scaled size first, so the logo started
       * large and visibly shrank a moment later. The zoom is also what makes the boot splash
       * land on exactly the size @drawable/splash draws the same logo at, so the handover from
       * the native splash has nothing to jump. src/main.tsx re-runs this on resize, so there
       * is one implementation.
       */
      window.mirufinFitTelevision = function () {
        var capacitor = window.Capacitor
        if (!capacitor || typeof capacitor.isNativePlatform !== "function") return
        if (!capacitor.isNativePlatform()) return
        var width = window.innerWidth
        var height = window.innerHeight
        if (width < 200 || height < 200) return
        var scale = width / 1500
        var root = document.documentElement
        root.style.zoom = String(scale)
        root.style.setProperty("--app-scale", String(scale))
        root.style.setProperty("--app-height", Math.round(height / scale) + "px")
        // 840 design units of 1500 is 56% of the screen: the width @drawable/splash draws the
        // logo at, so the native splash and the boot splash are the same size.
        root.style.setProperty("--boot-logo-width", "840px")
      }
      window.mirufinFitTelevision()
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/mirufin-logo.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
